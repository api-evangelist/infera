name: Infera
description: Infera is an AI-native laboratory automation platform (Y Combinator, Spring 2026)
  that converts plain-English descriptions of experiments into validated, instrument-ready runs
  across the lab instruments a team already owns. It compiles protocols into vendor-specific
  scripts for liquid handlers, plate readers, mass spectrometers, thermocyclers and centrifuges
  (Opentrons, Hamilton, Tecan and others), limits AI to initial drafts while keeping downstream
  steps deterministic and fully checkable, supports both automated and manual bench procedures,
  and maintains an end-to-end audit trail of protocols and runs. Founded in San Francisco by
  Troy Zhang and Chloe Sow.
